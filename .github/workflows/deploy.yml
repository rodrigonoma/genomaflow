name: Deploy Production

on:
  push:
    branches: [main]

# Garantia: somente um deploy ativo por vez. Pushes consecutivos cancelam
# runs antigas (em fila ou em curso) e mantêm apenas a mais recente.
# Previne saturação de runners + race condition no update-service ECS.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # changes: detecta quais caminhos foram tocados no push e expõe outputs
  # consumidos pelos demais jobs via `if: needs.changes.outputs.X == 'true'`.
  #
  # Estratégia path-based: economiza ~70% do tempo CI no caso médio. Hotfix
  # de CSS no Angular hoje toca apenas job test-web + deploy-web (vs build
  # full de api/worker + ECS de 3 services). Ver feedback_ci_deploy_pipeline.md.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
      migrations: ${{ steps.filter.outputs.migrations }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            worker:
              - 'apps/worker/**'
            web:
              - 'apps/web/**'
              - 'apps/landing/**'
            migrations:
              - 'apps/api/src/db/migrations/**'
            docs:
              - 'docs/**'
              - 'CLAUDE.md'
              - 'apps/worker/src/rag/**'
            infra:
              - 'infra/**'
            workflow:
              - '.github/workflows/**'

  # ---------------------------------------------------------------------------
  # Unit test gates — condicionais por componente
  # ---------------------------------------------------------------------------
  test-api:
    name: API unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npm run test:unit

  test-worker:
    name: Worker unit tests
    needs: changes
    if: needs.changes.outputs.worker == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: apps/worker
        run: |
          npm ci --no-audit --no-fund
          npm test

  test-web:
    name: Web unit tests + prod build
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm test
      # Production build pega erros strictTemplates (NG2/NG5/NG7) que jest+jsdom
      # não exerce. Bug 2026-05-12: 4 erros TS passaram pelos 192 testes verdes.
      - name: Web — production build check (strictTemplates)
        working-directory: apps/web
        run: npx ng build --configuration=production --output-path=/tmp/web-build-check

  # ---------------------------------------------------------------------------
  # Integration tests (Postgres + Redis real) — roda quando api OU migrations
  # mudaram. Smoke E2E das rotas aesthetic + RLS. Detalhes:
  # docs/claude-memory/feedback_ci_integration_setup.md
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests (Postgres real)
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.migrations == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genomaflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/genomaflow
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/genomaflow
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: integration-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: API — install deps
        working-directory: apps/api
        run: npm ci --no-audit --no-fund
      - name: API — apply migrations
        working-directory: apps/api
        run: node src/db/migrate.js
      - name: API — integration tests (aesthetic mutations)
        working-directory: apps/api
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Deploy na VPS Hostinger (BR) via SSH.
  #
  # A produção saiu da AWS em 06/2026 (docs/vps-migration.md). Até 24/08/2026
  # este workflow ainda fazia build → ECR → ECS: um caminho que não existe
  # mais. Push na main não levava nada pra produção, e o run verde dava a
  # impressão contrária — pior que não ter pipeline nenhum.
  #
  # Não há registry: a imagem é construída na própria VPS. O primeiro build
  # leva ~10min; os seguintes reaproveitam camada.
  #
  # Segredos necessários (Settings → Secrets and variables → Actions):
  #   VPS_SSH_KEY      chave privada com acesso root na VPS
  #   VPS_KNOWN_HOSTS  saída de `ssh-keyscan <ip-da-vps>`
  #   VPS_HOST         IP da VPS
  # ---------------------------------------------------------------------------
  deploy-vps:
    name: Deploy VPS
    needs: [changes, test-api, test-worker, test-web, integration]
    if: |
      always() &&
      (needs.changes.outputs.api == 'true' ||
       needs.changes.outputs.worker == 'true' ||
       needs.changes.outputs.web == 'true' ||
       needs.changes.outputs.migrations == 'true' ||
       needs.changes.outputs.workflow == 'true') &&
      (needs.test-api.result    == 'success' || needs.test-api.result    == 'skipped') &&
      (needs.test-worker.result == 'success' || needs.test-worker.result == 'skipped') &&
      (needs.test-web.result    == 'success' || needs.test-web.result    == 'skipped') &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Conferir segredos da VPS
        env:
          KEY:   ${{ secrets.VPS_SSH_KEY }}
          HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST:  ${{ secrets.VPS_HOST }}
        run: |
          missing=""
          [ -n "$KEY" ]   || missing="$missing VPS_SSH_KEY"
          [ -n "$HOSTS" ] || missing="$missing VPS_KNOWN_HOSTS"
          [ -n "$HOST" ]  || missing="$missing VPS_HOST"
          if [ -n "$missing" ]; then
            echo "❌ Faltam segredos:$missing"
            echo "Cadastrar em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Preparar SSH
        env:
          KEY:   ${{ secrets.VPS_SSH_KEY }}
          HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY"   > ~/.ssh/id_deploy   && chmod 600 ~/.ssh/id_deploy
          # known_hosts vem de segredo, NÃO de ssh-keyscan na hora: keyscan
          # aceita qualquer chave que responder, o que anula a proteção.
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST:   ${{ secrets.VPS_HOST }}
          SHA:        ${{ github.sha }}
          API:        ${{ needs.changes.outputs.api }}
          WORKER:     ${{ needs.changes.outputs.worker }}
          WEB:        ${{ needs.changes.outputs.web }}
          MIGRATIONS: ${{ needs.changes.outputs.migrations }}
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "root@$VPS_HOST" "bash -s -- '$SHA' '$API' '$WORKER' '$WEB' '$MIGRATIONS'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"; API="$2"; WORKER="$3"; WEB="$4"; MIGRATIONS="$5"

          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env"
          BRANCH="main"
          cd /opt/genomaflow

          echo "── Pré-checagem ────────────────────────────────────────────"
          CURRENT=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT" != "$BRANCH" ]; then
            echo "❌ A VPS está na branch '$CURRENT' e este workflow entrega '$BRANCH'."
            echo "   Puxar aqui não traria nada. Alinhar a branch antes de deployar."
            exit 1
          fi

          # A VPS tem arquivos versionados alterados na mão — o Caddyfile serve
          # TRÊS produtos (GenomaFlow, Auditty, Auditty-Sales). O deploy jamais
          # sobrescreve isso: --ff-only falha em vez de descartar.
          git fetch --quiet origin "$BRANCH"
          if ! git merge --ff-only "origin/$BRANCH"; then
            echo "❌ Não foi fast-forward: divergência ou conflito com alteração local."
            echo "   Resolver na mão na VPS — este passo não descarta nada."
            git status --porcelain
            exit 1
          fi
          echo "✅ Código em $(git rev-parse --short HEAD)"

          SERVICES=""
          if [ "$API" = "true" ] || [ "$MIGRATIONS" = "true" ]; then SERVICES="$SERVICES api"; fi
          if [ "$WORKER" = "true" ]; then SERVICES="$SERVICES worker"; fi
          if [ "$WEB" = "true" ]; then SERVICES="$SERVICES web"; fi
          SERVICES="${SERVICES# }"

          if [ -z "$SERVICES" ]; then
            echo "Nenhum serviço afetado — nada a construir."
            exit 0
          fi

          echo "── Build: $SERVICES ────────────────────────────────────────"
          # CACHEBUST é obrigatório: sem ele o Docker pode reaproveitar camada
          # com código antigo em silêncio (ver CLAUDE.md).
          $COMPOSE build --build-arg CACHEBUST="$SHA" $SERVICES

          if [ "$MIGRATIONS" = "true" ]; then
            echo "── Migrations ────────────────────────────────────────────"
            # Roda na imagem RECÉM construída e ANTES de trocar os contêineres:
            # se a migration falhar, a produção segue na versão anterior.
            $COMPOSE run --rm api node src/db/migrate.js
          fi

          echo "── Subindo: $SERVICES ──────────────────────────────────────"
          $COMPOSE up -d $SERVICES

          echo "── Verificando saúde ───────────────────────────────────────"
          for svc in $SERVICES; do
            name="genomaflow-$svc"
            has_hc=$(docker inspect -f '{{if .State.Health}}sim{{end}}' "$name")
            if [ -z "$has_hc" ]; then
              running=$(docker inspect -f '{{.State.Running}}' "$name")
              if [ "$running" != "true" ]; then
                echo "❌ $name não está rodando"
                docker logs --tail 50 "$name"
                exit 1
              fi
              echo "   ✅ $name rodando (sem healthcheck definido)"
              continue
            fi

            ok=""
            for i in $(seq 1 30); do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$name")
              if [ "$st" = "healthy" ]; then ok="sim"; break; fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "❌ $name não ficou healthy em 5min (último estado: $st)"
              docker logs --tail 50 "$name"
              exit 1
            fi
            echo "   ✅ $name healthy"
          done

          echo "✅ Deploy concluído em $(git rev-parse --short HEAD)"
          REMOTE

  # ---------------------------------------------------------------------------
  # Push só de documentação: não rebuilda nada, apenas reindexa o RAG do
  # Copilot de ajuda de produto (que lê docs/user-help/**).
  # ---------------------------------------------------------------------------
  reindex-docs-only:
    name: Reindex Copilot (push só de docs)
    needs: changes
    if: |
      needs.changes.outputs.docs == 'true' &&
      needs.changes.outputs.api != 'true' &&
      needs.changes.outputs.worker != 'true' &&
      needs.changes.outputs.web != 'true' &&
      needs.changes.outputs.migrations != 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        env:
          KEY:   ${{ secrets.VPS_SSH_KEY }}
          HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOSTS" ]; then
            echo "⚠️ Segredos da VPS ausentes — reindex pulado."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY"   > ~/.ssh/id_deploy   && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Reindexar docs do Copilot
        if: env.SKIP != '1'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 \
              "root@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/genomaflow
          git fetch --quiet origin main
          git merge --ff-only origin/main
          docker compose -f docker-compose.prod.yml --env-file .env \
            exec -T worker node src/rag/reindex-product-help.js
          echo "✅ Reindex concluído"
          REMOTE
